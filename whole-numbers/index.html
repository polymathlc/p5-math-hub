const topics = [
  {name:'Place value',title:'Inside a number',guide:'Read each group of three digits as millions, thousands and ones. Compare from the left. To round, look one place to the right of the rounding place. A digit of 5 or more rounds up.',example:'6,405,028 = six million four hundred and five thousand and twenty-eight.',questions:[
    ['Write 3,070,015 in words.','three million seventy thousand and fifteen','Read the groups as 3 million, 70 thousand and 15.'],
    ['Write nine million eight thousand and sixty in figures.','9008060','Use three digits for each group after the millions: 9 | 008 | 060.'],
    ['In 8,452,306, what is the value of the digit 5?','50000','The 5 is in the ten-thousands place.'],
    ['Fill in <, > or = between 7,090,500 and 7,900,050.','<','The first different digits are in the hundred-thousands place: 0 is less than 9.'],
    ['Round 6,749,499 to the nearest thousand.','6749000','The hundreds digit is 4. Keep the thousands digit and replace the last three digits with zeros.'],
    ['Round 9,950,000 to the nearest hundred thousand.','10000000','9,950,000 is halfway between 9,900,000 and 10,000,000. Round up.']]},
  {name:'Multiply & divide',title:'The scale machine',guide:'Split a multiple into a small factor and a power of ten. Multiplying or dividing by 10 changes each digit’s place by one column.',example:'14 × 300 = 14 × 3 × 100 = 4,200.',questions:[
    ['48 × 10','480','Move each digit one place to the left.'],
    ['73 × 100','7300','Move each digit two places to the left.'],
    ['6,000 ÷ 1,000','6','Move each digit three places to the right.'],
    ['35 × 400','14000','First multiply 35 by 4. Then multiply by 100.'],
    ['18,000 ÷ 30','600','Divide by 10, then divide the result by 3.'],
    ['A school packs 96,000 beads into bags of 2,000. How many bags does it fill?','48','Divide by 1,000, then divide by 2.']]},
  {name:'Order of operations',title:'One step at a time',guide:'Work inside brackets first. Then multiply and divide from left to right. Finally add and subtract from left to right. Work without a calculator.',example:'42 − (8 + 4) ÷ 3 = 42 − 12 ÷ 3 = 42 − 4 = 38.',questions:[
    ['18 + 6 × 4','42','Multiply 6 by 4 before adding 18.'],
    ['(18 + 6) × 4','96','Add inside the brackets first.'],
    ['72 ÷ 8 × 3','27','Division and multiplication have equal priority. Start on the left.'],
    ['50 − 18 + 6','38','Subtraction and addition have equal priority. Start on the left.'],
    ['90 − (12 + 8) × 3','30','Find the sum inside the brackets, multiply by 3, then subtract.'],
    ['96 ÷ (14 − 6) × 2 + 5','29','Calculate the brackets, then divide and multiply from left to right before adding 5.']]}
];
const units = 'zero one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen'.split(' ');
function words(n) {
  if(n<20) return units[n];
  if(n<100) return ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'][Math.floor(n/10)]+(n%10?'-'+words(n%10):'');
  for(const [size,label] of [[1000000,'million'],[1000,'thousand'],[100,'hundred']]) {
    if(n>=size) return words(Math.floor(n/size))+' '+label+(n%size?(n%size<100?' and ':' ')+words(n%size):'');
  }
}

];

function cleanWords(value){
  return value.toLowerCase().replace(/[-‐‑–,]/g,' ').replace(/\band\b/g,' ').replace(/\s+/g,' ').trim();

function parseWhole(value){
  const s=String(value).trim();
  if(!/^(?:\d+|\d{1,3}(?:,\d{3})+|\d{1,3}(?:[ \u00a0\u202f]\d{3})+)$/.test(s))return NaN;
  const n=Number(s.replace(/[,\s]/g,''));
  return Number.isSafeInteger(n)?n:NaN;
}
function matches(value,answer){
  if(/^\d+$/.test(answer))return parseWhole(value)===Number(answer);
  if(['<','>','='].includes(answer))return value.trim()===answer;
  return cleanWords(value)===cleanWords(answer);
}

}

function numberBox(value,onInput){

function select(items,selected,update){

}

const abDigits=[2,4,6];

    if(!row){row=button('','ab-row',()=>{abDigits[i]=(abDigits[i]+1)%10;renderAbacus(i);});rack.append(row);}
    row.replaceChildren();row.title=name+' · tap to add a bead';row.setAttribute('aria-label',name+', '+abDigits[i]+' beads. Add one, wrapping to zero after nine.');

  });
  $('ab-caption').textContent='Tap a row · '+Number(abDigits.join(''));

function drawPlace(){
  const {controls,visual}=newModel();
  const update=()=>{
    const n=parseWhole(state.number),other=parseWhole(state.other);
    visual.replaceChildren();
    if(!(n<=10000000)||(state.mode===1&&!(other<=10000000))){
      visual.append(element('p','retry','Enter each number as a whole number from 0 to 10,000,000.'));return;
    }
    if(state.mode===0){
      visual.append(element('h3','','Tap a digit to see its value'));
      const row=element('div','tiles');
      const ds=String(n);const selected=Math.min(state.selected,ds.length-1);
      const detail=element('p','note');
      const setSelected=p=>{
        state.selected=p;
        for(const b of row.children){
          const chosen=Number(b.dataset.place)===p;b.classList.toggle('chosen',chosen);b.setAttribute('aria-pressed',String(chosen));
        }
        const digit=Number(ds[ds.length-1-p]);
        detail.textContent='The '+digit+' in the '+placeNames[p]+' place has a value of '+fmt(digit*10**p)+'.';
      };
      for(let p=7;p>=0;p--){
        const d=ds[ds.length-1-p],tile=d===undefined?element('div'):button('','',()=>setSelected(p));
        tile.className='digit group'+Math.floor(p/3)+(d===undefined?' empty':'');tile.dataset.place=p;
        if(d===undefined)tile.setAttribute('aria-hidden','true');else tile.setAttribute('aria-label',d+' in the '+placeNames[p]+' place');
        tile.append(element('b','',d??'–'),element('small','',placeTags[p]));row.append(tile);
      }
      const spoken=words(n);visual.append(row,element('p','readout',spoken[0].toUpperCase()+spoken.slice(1)),detail);setSelected(selected);
    }else if(state.mode===1){
      const a=String(n).padStart(8,'0'),b=String(other).padStart(8,'0'),idx=[...a].findIndex((d,i)=>d!==b[i]);
      function marked(num){
        const span=element('span');let place=String(num).length-1;
        for(const c of fmt(num)){
          span.append(element('span',c!==','&&7-place===idx?'diff':'',c));if(c!==',')place--;
        }return span;
      }
      const eq=element('div','bigexpr');eq.append(marked(n),element('span','eqmark',n===other?' = ':n>other?' > ':' < '),marked(other));
      const note=idx<0?'Every place has the same digit. The two numbers are equal.':'Compare from the left. The first difference is in the '+placeNames[7-idx]+' place. '+a[idx]+' is '+(n>other?'greater':'less')+' than '+b[idx]+'.';
      visual.append(eq,element('p','note',note));
    }else{
      const unit=state.round,lower=Math.floor(n/unit)*unit,upper=lower+unit,atLimit=lower===10000000,start=atLimit?lower-unit:lower,end=atLimit?lower:upper,middle=start+unit/2;
      const answer=Math.round(n/unit)*unit;
      const trackWrap=element('div','track-wrap'),track=element('div','track'),mark=element('span','marker'),axis=element('div','axis');
      mark.style.left=((n-start)/unit*100)+'%';track.append(element('span','midline'),mark);
      axis.append(element('span','',fmt(start)),element('span','',fmt(middle)),element('span','',fmt(end)));trackWrap.append(track,axis);
      const reason=n%unit===0?'It is already a multiple of '+fmt(unit)+'.':n===middle?'It is exactly halfway. Round up to the higher multiple.':fmt(n)+' is '+(n<middle?'below':'above')+' the midpoint of '+fmt(middle)+', so round '+(n<middle?'down':'up')+'.';
      visual.append(element('div','bigexpr',fmt(n)+' ≈ '+fmt(answer)),trackWrap,element('p','note',reason));
    }
  };
  controls.append(field(state.mode===1?'First number':'Your number',numberBox(state.number,v=>{state.number=v;update();})));
  if(state.mode===1)controls.append(field('Second number',numberBox(state.other,v=>{state.other=v;update();})));
  if(state.mode===2)controls.append(field('Round to the nearest',select([10,100,1000,10000,100000,1000000].map(n=>[n,fmt(n)]),state.round,v=>{state.round=Number(v);update();})));
  update();
}
function drawScale(){
  const {controls,visual}=newModel();
  const update=()=>{
    const n=parseWhole(state.base),multiply=state.op==='×',f=state.factor,p=state.power,m=f*p;
    visual.replaceChildren();
    if(!(n<=10000000)){visual.append(element('p','retry','Enter a whole number from 0 to 10,000,000.'));return;}
    if(!multiply&&n%m!==0){
      const groups=Math.floor(n/m),remainder=n%m;
      visual.append(element('div','bigexpr reveal',fmt(n)+' ÷ '+fmt(m)+' = '+fmt(groups)+' R '+fmt(remainder)),
        element('p','note',fmt(groups)+' whole groups of '+fmt(m)+' use '+fmt(groups*m)+'. There are '+fmt(remainder)+' left over.'),
        element('p','note','Check: '+fmt(groups)+' × '+fmt(m)+' + '+fmt(remainder)+' = '+fmt(n)+'.'));return;
    }
    const intermediate=multiply?n*f:n/p,result=multiply?intermediate*p:intermediate/f;
    const heading=element('div','bigexpr reveal',fmt(n)+' '+state.op+' '+fmt(m)+' = '+fmt(result));
    const row=element('div','steps');
    const first=element('div','step'),second=element('div','step');
    first.append(element('small','','STEP 1'),element('span','',fmt(n)+' '+state.op+' '+fmt(multiply?f:p)+' = '+fmt(intermediate)));
    second.append(element('small','','STEP 2'),element('span','',fmt(intermediate)+' '+state.op+' '+fmt(multiply?p:f)+' = '+fmt(result)));
    row.append(first,second);
    const shifts=Math.log10(p);
    visual.append(heading,row,element('p','note',fmt(m)+' = '+f+' × '+fmt(p)+'. '+(multiply?'Multiplying':'Dividing')+' by '+fmt(p)+' moves each digit '+shifts+' place'+(shifts===1?'':'s')+' to the '+(multiply?'left.':'right.')));
  };
  const input=numberBox(state.base,v=>{state.base=v;update();});
  controls.append(field('Starting number',input));
  const sub=element('div','control-row');
  sub.append(field('Operation',select([['×','Multiply ×'],['÷','Divide ÷']],state.op,v=>{
    state.op=v;update();
  })),field('Factor',select(Array.from({length:9},(_,i)=>[i+1,i+1]),state.factor,v=>{state.factor=Number(v);update();})));
  controls.append(sub,field('Power of ten',select([10,100,1000].map(n=>[n,fmt(n)]),state.power,v=>{state.power=Number(v);update();})));update();
}
const examples=[
  ['Brackets',[42,'−','(',8,'+',4,')','÷',3]],
  ['Same priority',[72,'÷',8,'×',3,'−',5]],
  ['Mixed signs',[50,'−',18,'+',6,'×',2]],
  ['Two brackets',['(',15,'+',9,')','÷','(',8,'−',4,')']]
];
let expression=[...examples[0][1]];
let history=[];
function nextOperation(tokens){
  const end=tokens.indexOf(')'),start=end<0?0:tokens.lastIndexOf('(',end)+1,stop=end<0?tokens.length:end;
  let index=tokens.findIndex((v,i)=>i>=start&&i<stop&&['×','÷'].includes(v));
  if(index<0)index=tokens.findIndex((v,i)=>i>=start&&i<stop&&['+','−'].includes(v));
  return {index,inBrackets:end>=0};
}
const calculate=(a,op,b)=>op==='×'?a*b:op==='÷'?a/b:op==='+'?a+b:a-b;
function simplify(tokens,index){
  const a=tokens[index-1],op=tokens[index],b=tokens[index+1],value=calculate(a,op,b),result=[...tokens];
  result.splice(index-1,3,value);
  if(result[index-2]==='('&&result[index]===')')result.splice(index-2,3,value);
  return {tokens:result,fact:a+' '+op+' '+b+' = '+value};
}
function drawOrder(focusModel=false){
  const {controls,visual}=newModel();
  controls.append(element('h3','','Choose an expression'));
  const choices=element('div','op-list');
  function reset(i){state.example=i;expression=[...examples[i][1]];history=[];drawOrder(true);}
  examples.forEach(([name],i)=>{const b=button(name,'',()=>reset(i));b.setAttribute('aria-pressed',String(state.example===i));choices.append(b);});
  controls.append(choices,element('p','note','Work without a calculator. Tap the operation you would do next.'));
  const {index,inBrackets}=nextOperation(expression),eq=element('div','bigexpr'),feedback=element('p','op-feedback'),trace=element('p','note',history.join('   ·   '));
  feedback.setAttribute('role','status');
  const rule=inBrackets?'Work inside brackets first.':expression.includes('×')||expression.includes('÷')?'Multiply and divide from left to right.':'Add and subtract from left to right.';
  expression.forEach((token,i)=>{
    if(['×','÷','+','−'].includes(token)){
      const b=button(token,'operation',()=>{
        const otherBracket=inBrackets&&expression[i-2]==='('&&expression[i+2]===')';
        if(i!==index&&!otherBracket){feedback.className='op-feedback retry';feedback.textContent='Try again. '+rule;return;}
        const next=simplify(expression,i);history.push(next.fact);expression=next.tokens;drawOrder(true);
      });
      b.setAttribute('aria-label','Choose '+expression.slice(Math.max(0,i-1),i+2).join(' '));eq.append(b);
    }else eq.append(document.createTextNode(String(token)));
  });
  visual.append(eq,trace,feedback);
  if(index<0){feedback.textContent='Solved. The value of the expression is '+expression[0]+'.';feedback.className='op-feedback success';visual.append(button('Try again','textbtn',()=>reset(state.example)));}
  else feedback.textContent=rule;
  if(focusModel)(visual.querySelector('button')||eq).focus({preventScroll:true});
}
function progress(){
  $('progress').textContent=answers[state.topic].filter(a=>a.done).length+' / 6 correct';
}
function renderPractice(){
  const grid=$('practice');grid.replaceChildren();progress();
  topics[state.topic].questions.forEach(([q,a,h],i)=>{
    const t=state.topic,attempt=answers[t][i],card=element('article','qcard'),title=element('div','group-title'),prompt=element('p','prompt',q),form=element('form','answer'),input=element('input','entry'),check=element('button','action primary','Check'),feedback=element('div','feedback'),hint=element('details');
    title.append(element('span','qid','Q'+String(i+1).padStart(2,'0')),element('span','skill-name',classNames[t][i]));
    prompt.id='question-'+t+'-'+i;input.setAttribute('aria-labelledby',prompt.id);input.placeholder='Your answer';input.autocomplete='off';input.maxLength=180;if(/^\d+$/.test(a))input.inputMode='numeric';
    feedback.setAttribute('role','status');input.value=attempt.value;check.type='submit';
    hint.append(element('summary','','Show hint'),element('p','',h));
    const correct=()=>{feedback.className='feedback success';feedback.textContent='Correct. '+workings[t][i];card.classList.add('done');};
    if(attempt.done)correct();
    input.oninput=()=>{attempt.value=input.value;attempt.done=false;feedback.textContent='';card.classList.remove('done');save();progress();};
    form.onsubmit=e=>{e.preventDefault();attempt.value=input.value;attempt.done=matches(input.value,a);if(attempt.done)correct();else{feedback.className='feedback retry';feedback.textContent=input.value.trim()?'Try again. '+h:'Enter an answer first.';}save();progress();};
    form.append(input,check);card.append(title,prompt,form,feedback,hint);grid.append(card);
  });
}
function drawLab(){
